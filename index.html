<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F1F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1920" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Revision Room">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="config.js"></script>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Revision Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one calm column. Library of lessons -> a lesson's four exercise tiles -> one exercise at a time. */
:root{
  --bg:#F1F5F8; --surface:#FFFFFF; --ink:#13212B; --muted:#586873; --line:#D6DFE6;
  --accent:#0E6B66; --accent-ink:#FFFFFF; --tint:#E2F0EE;
  --mark:#FFD84D; --mark-ink:#13212B;
  --good:#17703D; --good-bg:#E1F3E8; --bad:#B3261E; --bad-bg:#FBE6E3;
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1920; --surface:#16252E; --ink:#E7EDF1; --muted:#9AADB9; --line:#2A3D49;
    --accent:#52C4BA; --accent-ink:#052321; --tint:#17353A;
    --mark:#E9C444; --mark-ink:#13212B;
    --good:#6FD596; --good-bg:#173628; --bad:#FF9188; --bad-bg:#3C1F1D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1920; --surface:#16252E; --ink:#E7EDF1; --muted:#9AADB9; --line:#2A3D49;
  --accent:#52C4BA; --accent-ink:#052321; --tint:#17353A;
  --mark:#E9C444; --mark-ink:#13212B;
  --good:#6FD596; --good-bg:#173628; --bad:#FF9188; --bad-bg:#3C1F1D;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-inline:16px}
.wrap{max-width:640px;margin:0 auto;padding-block:28px 64px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,.display{font-family:var(--display);letter-spacing:-.02em}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.eyebrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(32px,8vw,46px);line-height:1.08;margin:0 0 12px;font-weight:700;text-wrap:balance;overflow-wrap:anywhere}
.hl{background:linear-gradient(transparent 60%,var(--mark) 60% 92%,transparent 92%);padding:0 .12em;margin-left:-.12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
:root[data-theme="dark"] .hl{background:linear-gradient(transparent 60%,color-mix(in srgb,var(--mark) 55%,transparent) 60% 92%,transparent 92%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hl{background:linear-gradient(transparent 60%,color-mix(in srgb,var(--mark) 55%,transparent) 60% 92%,transparent 92%)}}
.sub{margin:0;color:var(--muted);max-width:52ch}

/* library */
.drop{display:grid;gap:4px;margin-top:26px;padding:26px 20px;background:var(--surface);border:2px dashed var(--line);border-radius:16px;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over,.drop:focus-within{border-color:var(--accent)}
.drop.over{background:var(--tint)}
.dt{font:700 22px/1.2 var(--display);letter-spacing:-.01em}
.dd{color:var(--muted);font-size:15px}
.msg:not(:empty){margin:14px 0 0;padding:11px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:15px;white-space:pre-line}
.msg.good{background:var(--good-bg);border-color:transparent}
.msg.bad{background:var(--bad-bg);border-color:transparent}
.warn{margin:14px 0 0;padding:11px 14px;border-radius:12px;background:var(--bad-bg);font-size:14px}
.label{margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.lessons{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.lesson{display:flex;gap:12px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.lm{flex:1 1 200px;min-width:0;display:grid;gap:2px}
.lt{font:700 19px/1.25 var(--display);letter-spacing:-.01em;overflow-wrap:anywhere}
.lc{color:var(--muted);font-size:14px}
.la{display:flex;flex-wrap:wrap;gap:8px;flex:none}
.sec{margin-top:30px}
.mon{margin-top:14px}
.mon>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;padding:0 4px;cursor:pointer;font:700 18px var(--display);letter-spacing:-.01em}
.mon>summary::-webkit-details-marker{display:none}
.mon>summary::after{content:'';flex:none;width:9px;height:9px;margin-left:4px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
.mon[open]>summary::after{transform:rotate(-135deg)}
.mon .mc{margin-left:auto;font:500 14px var(--body);color:var(--muted)}
.mon>.lessons{margin-top:6px}
.how{margin-top:30px}
.how h2{font-size:21px;margin:0 0 6px}
.how p{margin:0 0 14px;color:var(--muted);max-width:56ch}
.mini{overflow-x:auto;margin-bottom:16px}
.mini table{border-collapse:collapse;width:100%;font-size:15px;background:var(--surface)}
.mini th,.mini td{border:1px solid var(--line);padding:7px 12px;text-align:left}
.mini th{color:var(--muted);font-weight:600;font-size:13px}
.brand{display:flex;align-items:center;gap:8px;margin:0 0 14px;font:600 13px var(--body);letter-spacing:.01em;color:var(--accent)}
.brand{text-decoration:none;width:fit-content}
.brand:hover{text-decoration:underline}
.brand .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--mark)}
.uisel{margin-left:auto;min-height:34px;padding:0 26px 0 10px;font:600 13px var(--body);letter-spacing:0;text-transform:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;cursor:pointer}
.pick{margin-top:22px}
.pick .seg{margin-top:8px}
.hint{margin:8px 0 0;font-size:13px;color:var(--muted)}
.yt{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin-top:6px}
.yt iframe,.yt>div{position:absolute;inset:0;width:100%;height:100%}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.ctl .count{margin-left:auto}
.btn.on,.btn.ghost.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mks{max-width:100%}.mk{min-width:0}
.mks{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.mk{display:flex;gap:8px;align-items:center}
.mk input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mk .ck{flex:1;min-width:0;overflow-wrap:anywhere}
.chip{flex:none;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-weight:600;cursor:pointer}
.x{flex:none;width:40px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:20px;cursor:pointer}
.fb{display:grid;gap:14px;margin-top:18px}
.fb label{display:grid;gap:6px;font-size:14px;font-weight:600}
.fb input,.fb textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.fb textarea{min-height:140px;resize:vertical}
.fb .trap{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.foot{margin:28px 0 0;font-size:13px;color:var(--muted)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:28px}
.tile{display:flex;flex-direction:column;gap:2px;text-align:left;padding:16px;min-height:132px;background:var(--surface);border:1px solid var(--line);border-radius:14px;cursor:pointer;transition:border-color .15s,transform .15s}
.tile:hover:not(:disabled){border-color:var(--accent)}
.tile:active:not(:disabled){transform:scale(.985)}
.tile:disabled{opacity:.5;cursor:default}
.tn{font:700 21px/1.15 var(--display);letter-spacing:-.01em;overflow-wrap:anywhere}
.tc{color:var(--muted);font-size:14px}
.tl{margin-top:auto;padding-top:14px;font-size:13px;font-weight:600;color:var(--accent)}

/* session chrome */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:12px}
.link{background:none;border:0;padding:8px 0;color:var(--accent);font-weight:600;cursor:pointer;text-align:left}
.link.small{font-size:14px;font-weight:500;color:var(--muted);margin-top:14px;display:block}
.count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:26px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.hint{margin:12px 0 0;color:var(--muted);font-size:14px}

/* buttons */
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.btn{flex:1 1 150px;min-height:50px;padding:0 20px;border-radius:12px;border:1px solid transparent;font-weight:600;cursor:pointer}
.btn.sm{flex:none;min-height:42px;padding:0 16px;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);border-color:var(--line)}
.btn.armed{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}

/* flashcard */
.flash{display:flex;flex-direction:column;justify-content:center;gap:14px;width:100%;min-height:290px;padding:44px 24px 28px;position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;cursor:pointer}
.flash .side{position:absolute;top:16px;left:20px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.flash .face{font:700 clamp(24px,6vw,30px)/1.25 var(--display);letter-spacing:-.01em;animation:pop .18s ease;overflow-wrap:anywhere}
.flash .face.back{color:var(--accent)}
@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* gap fill */
.sentence{font-size:clamp(19px,4.8vw,23px);line-height:2.3;margin:0}
input.gap{font:inherit;color:var(--ink);text-align:center;background:var(--tint);border:0;border-bottom:2px solid var(--muted);border-radius:6px 6px 0 0;padding:0 6px;margin:0 3px;max-width:100%;min-width:3.4em}
input.gap:focus{outline:none;border-bottom-color:var(--accent);background:var(--surface);box-shadow:0 0 0 2px var(--accent)}
input.gap.ok{background:var(--good-bg);border-bottom-color:var(--good);color:var(--good)}
input.gap.no{background:var(--bad-bg);border-bottom-color:var(--bad);color:var(--bad);text-decoration:line-through}
.fix{font-weight:600;color:var(--good);margin-right:4px}
.fb{margin-top:18px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);overflow-wrap:anywhere}
.fb.ok{background:var(--good-bg);border-color:transparent}
.fb.no{background:var(--bad-bg);border-color:transparent}
.fb b{color:var(--good)} .fb.no b{color:var(--bad)}

/* quiz */
.q{font:700 clamp(21px,5.4vw,26px)/1.3 var(--display);letter-spacing:-.01em;margin:0 0 20px;text-wrap:balance;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:13px 14px;min-height:54px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;overflow-wrap:anywhere}
.opt span:last-child{min-width:0}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--tint);font-size:13px;font-weight:600;color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}

/* matching */
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.col{display:grid;gap:10px;align-content:start}
.chip{min-height:56px;padding:10px 12px;text-align:left;font-size:15px;line-height:1.3;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;overflow-wrap:anywhere}
.chip.sel{border-color:var(--accent);background:var(--tint);box-shadow:0 0 0 1px var(--accent)}
.chip.done{background:var(--good-bg);border-color:transparent;color:var(--good);cursor:default}
.chip.slip{background:var(--bad-bg);border-color:var(--bad);animation:nudge .3s}
@keyframes nudge{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* results */
.res .big{font:700 clamp(56px,16vw,84px)/1 var(--display);letter-spacing:-.03em;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.res .msg2{font:700 22px/1.2 var(--display);margin:18px 0 0}

/* audio */
.fwrap{position:relative}
.spk{position:absolute;top:10px;right:10px;width:46px;height:46px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--accent);cursor:pointer}
.spk:hover{border-color:var(--accent)}
.lwrap{display:grid;place-items:center;margin:22px 0 18px}
.lspk{width:96px;height:96px;display:grid;place-items:center;border-radius:50%;border:2px solid var(--accent);background:var(--tint);color:var(--accent);cursor:pointer}
.lspk:active{transform:scale(.96)}
.lin{display:block;width:100%;min-height:54px;padding:0 14px;font:inherit;font-size:18px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px}
.lin:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.lin.ok{background:var(--good-bg);border-color:transparent;color:var(--good)}
.lin.no{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.tile.wide{grid-column:1/-1;min-height:96px}
.links{display:flex;gap:0 22px;flex-wrap:wrap}
.vpick{display:flex;align-items:center;gap:10px;margin-top:12px}
.vpick select{flex:1;min-width:0;min-height:42px;padding:0 10px;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px}
.voice{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin-top:18px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.segb{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;cursor:pointer}
.segb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

/* reader */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:6px;margin-bottom:10px;background:var(--bg)}
.zoom{display:flex;align-items:center;gap:6px}
.zbtn{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;cursor:pointer}
.zbtn:disabled{opacity:.4;cursor:default}
.zl{min-width:3.4em;text-align:center;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.rt{font-size:clamp(22px,6vw,30px);line-height:1.15;margin:0 0 6px;overflow-wrap:anywhere}
.pages{overflow-x:auto;margin-top:14px;-webkit-overflow-scrolling:touch}
.pg{display:block;margin:0 0 12px;background:#fff;border:1px solid var(--line);border-radius:6px}
.doc{margin-top:14px;padding:6px 18px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-wrap:anywhere}
.doc h2,.doc h3,.doc h4{font-family:var(--display);letter-spacing:-.01em;line-height:1.25;margin:20px 0 8px}
.doc h2{font-size:24px}.doc h3{font-size:20px}.doc h4{font-size:17px}
.doc p,.doc li{margin:0 0 10px}.doc ul,.doc ol{padding-left:22px;margin:0 0 10px}
.doc code{background:var(--tint);padding:1px 5px;border-radius:5px;font-size:.92em}
.tw{overflow-x:auto;margin:0 0 14px}
.doc table{border-collapse:collapse;width:100%;font-size:15px}
.doc th,.doc td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.doc th{background:var(--tint)}
.rmsg{margin:18px 0;color:var(--muted)}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script src="pdf.min.js"></script>
<script>
/* Lesson-notes parser and exercise builders. Pure functions, no DOM. */
var Parser = (function () {
  var HEADER = /^(english|spanish|serbian|russian|german|french|italian|deutsch|german|srpski|srpska|chunk|chunks|phrase|phrases|vocabulary|vocab|word|words|expression|expressions|translation|meaning|gloss|слово|слова|фраза|фразы|выражение|перевод|значение|английский|испанский|сербский|русский|немецкий|французский|итальянский)(?![\p{L}])/iu;
  var VOCAB = /vocab|chunk|слов|лексик|phrase|expression|palabras|frases|l[eé]xico|vokabel|vokabular|wortschatz|redewendung|wendung|ausdr[uü]ck|vocabulaire|locution|mots|rečnik|recnik|izraz|fraz|reči|речник|израз|фраз/i;
  var STOP = new Set('a an the to of in on at for with and or but is are was were be been being am do does did have has had will would can could should may might must shall not no it its this that these those you your he she we they them his her our their my me one ones some any about up out off over into from by as if than then so too very just also more most much many get got go goes going made make sth smth smb sb someone something somebody'.split(' '));

  function clean(s) {
    return String(s).replace(/<br\s*\/?>/gi, ' ').replace(/\\\|/g, '|').replace(/!?\[([^\]]*)\]\([^)]*\)/g, '$1')
      .replace(/[*`]/g, '').replace(/[\u2018\u2019]/g, "'").replace(/\s+/g, ' ').replace(/^_+|_+$/g, '').trim();
  }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function sample(a, n) { return shuffle(a).slice(0, n); }
  function dedupe(items) {
    var seen = {}, out = [];
    items.forEach(function (it) { var k = it.a.toLowerCase(); if (!seen[k]) { seen[k] = 1; out.push(it); } });
    return out;
  }
  /* If the notes have a Vocabulary/Chunks section, use only the tables inside it. Otherwise use every table. */
  function onlyVocab(items) {
    var v = items.filter(function (it) { return it.v; });
    return (v.length ? v : items).map(function (it) { return { a: it.a, b: it.b }; });
  }
  function isHeaderRow(row) { return row.length >= 2 && HEADER.test(row[0]) && HEADER.test(row[1]); }

  /* ---------- Markdown ---------- */
  function splitRow(line) {
    var t = line.trim();
    if (t[0] === '|') t = t.slice(1);
    if (t[t.length - 1] === '|' && t[t.length - 2] !== '\\') t = t.slice(0, -1);
    var cells = [], cur = '';
    for (var i = 0; i < t.length; i++) {
      if (t[i] === '\\' && t[i + 1] === '|') { cur += '|'; i++; }
      else if (t[i] === '|') { cells.push(cur); cur = ''; }
      else cur += t[i];
    }
    cells.push(cur);
    return cells.map(clean);
  }
  function isSep(cells) { return cells.length > 0 && cells.every(function (c) { return /^:?-+:?$/.test(c.replace(/\s/g, '')); }); }

  function parseMarkdown(text) {
    var lines = String(text).replace(/\r/g, '').split('\n'), items = [], i = 0, vocabLevel = 0;
    function addTable(rows, inVocab) {
      var start = 0;
      if (rows.length > 1 && isSep(rows[1])) start = 2; else if (rows.length && isHeaderRow(rows[0])) start = 1;
      for (var r = start; r < rows.length; r++) {
        if (isSep(rows[r])) continue;
        var a = rows[r][0], b = rows[r][1];

        i++; continue;
      }
      if (tr[0] === '|') {
        var rows = [];
        while (i < lines.length && lines[i].trim()[0] === '|') { rows.push(splitRow(lines[i])); i++; }
        addTable(rows, !!vocabLevel); continue;
      }
      i++;

    if (!items.length) {
      lines.forEach(function (ln) {
        var m = /^\s*(?:[-*+]|\d+[.)])\s+(.+?)\s+(?:\u2014|\u2013|=|\u2192)\s+(.+)$/.exec(ln);
        if (m) { var a = clean(m[1]), b = clean(m[2]); if (a && b) items.push({ a: a, b: b, v: false }); }

  /* ---------- PDF (items come from pdf.js: {str, x, y, w, h}) ---------- */
  function toLines(items, colXs) {
    var its = items.filter(function (i) { return i.str.trim(); }).sort(function (p, q) { return q.y - p.y || p.x - q.x; });
    var rows = [];

      L.its.forEach(function (it) {

        var gap = c ? it.x - c.end : 0;
        var atCol = !!(colXs && colXs.some(function (x) { return Math.abs(x - it.x) < 1.5; }));
        if (c && (atCol || gap > Math.max(8, it.h * 1.6))) { cells.push(c); c = null; }
        if (!c) c = { x: it.x, text: it.str, end: it.x + it.w };
        else { c.text += (gap > it.h * 0.1 && !/\s$/.test(c.text) && !/^\s/.test(it.str) ? ' ' : '') + it.str; c.end = it.x + it.w; }

    var count = {};

      }
      var c = cs[0];
      if (last && lastY - L.y < 1.5 * L.h && L.h <= med * 1.1) {
        if (Math.abs(c.x - last.bx) < 3) { last.b = join(last.b, c.text); lastY = L.y; return; }
        if (Math.abs(c.x - last.ax) < 3) { last.a = join(last.a, c.text); lastY = L.y; return; }
      }
      last = null; inTable = false;
      if (L.h > med * 1.1 && c.text.length < 90) {

      .map(function (r) { return { a: r.a, b: r.b, v: r.v }; });
    return { items: dedupe(onlyVocab(items)) };
  }

  /* ---------- Language of the left column: 'en', 'es' or 'ru' (a guess, the student can change it) ---------- */
  var ES_W = new Set('el la los las un una unos unas de del al que por para con se su sus mi tu lo y es está estar ser tener hacer ir dar darse echar poner hay muy más pero como cuando donde'.split(' '));
  var EN_W = new Set('the to of and in is be have it you for with on at up out off get take make not your my an by from that this are was'.split(' '));

  }

  function makeQuiz(items, n) {
    var out = [];

      var dir = Math.random() < 0.5, key = dir ? 'b' : 'a';

  function hardItems(){

    if (id === '!') { var hi = hardItems(); return hi.length ? {id: '!', title: t('tricky'), items: hi} : null; }
    if (id.slice(0, 2) === 'm:') {
      var mk = id.slice(2), ml = S.lessons.filter(function(x){ return monthKey(lessonTime(x)) === mk; });
      if (!ml.length) return null;

      return {id: id, title: monthLabel(+mk.slice(0, 4), +mk.slice(5) - 1), items: Parser.dedupe(mit)};

      var items = [];
      S.lessons.forEach(function(l){ items = items.concat(withLang(l)); });
      return {id: '*', title: t('mixed'), items: Parser.dedupe(items)};
    }
    var l = S.lessons.filter(function(x){ return x.id === id; })[0];

  function readText(file){ return new Promise(function(res, rej){ var fr = new FileReader(); fr.onload = function(){ res(String(fr.result)); }; fr.onerror = function(){ rej(new Error('read')); }; fr.readAsText(file); }); }
  function readPdf(file){
    return new Promise(function(res, rej){
      if (!window.pdfjsLib) { rej(new Error('nolib')); return; }
      var fr = new FileReader();
      fr.onerror = function(){ rej(new Error('read')); };
      fr.onload = function(){
        var keep = fr.result.slice(0);
        pdfjsLib.getDocument({data: new Uint8Array(fr.result)}).promise.then(function(doc){
          var pages = [], chain = Promise.resolve();
          for (var n = 1; n <= doc.numPages; n++) (function(n){
            chain = chain.then(function(){ return doc.getPage(n); }).then(function(pg){ return pg.getTextContent(); }).then(function(tc){
              pages.push(tc.items.map(function(it){ var t = it.transform; return {str: it.str, x: t[4], y: t[5], w: it.width, h: it.height || Math.abs(t[3])}; }));
            });
          })(n);
          return chain.then(function(){
            var any = pages.some(function(p){ return p.some(function(i){ return i.str.trim(); }); });
            if (!any) throw new Error('notext');
            res({r: Parser.parsePdf(pages), data: keep});
          });
        }).catch(rej);
      };
      fr.readAsArrayBuffer(file);
    });
  }

  function addLesson(title, r){
    var ex = S.lessons.filter(function(l){ return l.title.toLowerCase() === title.toLowerCase(); })[0];
    var id;
    if (ex) { ex.items = r.items; delete ex.rules; ex.added = Date.now(); id = ex.id; if (!ex.langSet) ex.lang = addLang(); }
    else { id = uid(); S.lessons.unshift({id: id, title: title, added: Date.now(), items: r.items, lang: addLang()}); }
    persist();
    return id;
  }

  async function handleFiles(files){
    var msg = $('#msg'), ok = [], bad = [];
    for (var i = 0; i < files.length; i++) {
      var f = files[i], title = f.name.replace(/\.[^.]+$/, '').replace(/_/g, ' ').trim() || 'Lesson';
      msg.className = 'msg'; msg.textContent = t('reading', {f: f.name});
      try {
        var isPdf = /\.pdf$/i.test(f.name) || f.type === 'application/pdf';
        var r, rec;
        if (isPdf) { var o = await readPdf(f); r = o.r; rec = {type: 'pdf', name: f.name, data: o.data}; }
        else { var txt = await readText(f); r = Parser.parseMarkdown(txt); rec = {type: 'md', name: f.name, text: txt}; }
        if (!r.items.length) bad.push('“' + f.name + '”: ' + t('err_table'));
        else { var lid = addLesson(title, r); await putFile(lid, rec); ok.push('“' + title + '”: ' + plural(r.items.length, 'chunk')); }
      } catch (e) {
        var why = e && e.message === 'notext' ? t('err_notext') : e && e.message === 'nolib' ? t('err_nolib') : t('err_read');
        bad.push('“' + f.name + '”: ' + why);
      }
    }
    notice = {kind: bad.length ? (ok.length ? '' : 'bad') : 'good', text: (ok.length ? t('added_list', {x: ok.join('; ')}) : '') + (ok.length && bad.length ? '\n' : '') + bad.join('\n')};
    library();
  }

  /* ---------- reader ---------- */
  function mdInline(t){
    return esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>');
  }
  function mdCells(ln){
    var t = ln.trim().replace(/^\|/, '').replace(/\|$/, ''), out = [], cur = '';
    for (var i = 0; i < t.length; i++) {
      if (t[i] === '\\' && t[i + 1] === '|') { cur += '|'; i++; } else if (t[i] === '|') { out.push(cur.trim()); cur = ''; } else cur += t[i];
    }
    out.push(cur.trim());
    return out;
  }
  function mdToHtml(text){
    var lines = String(text).replace(/\r/g, '').split('\n'), out = [], i = 0, list = null, m;
    function close(){ if (list) { out.push('</' + list + '>'); list = null; } }
    function open(tag){ if (list !== tag) { close(); out.push('<' + tag + '>'); list = tag; } }
    while (i < lines.length) {
      var t = lines[i].trim();
      if (!t) { close(); i++; continue; }
      if ((m = /^(#{1,6})\s+(.*?)\s*#*$/.exec(t))) { close(); var n = Math.min(m[1].length, 3) + 1; out.push('<h' + n + '>' + mdInline(m[2]) + '</h' + n + '>'); i++; continue; }
      if (t[0] === '|') {
        close(); var rows = [];
        while (i < lines.length && lines[i].trim()[0] === '|') { rows.push(mdCells(lines[i])); i++; }
        var head = rows.length > 1 && rows[1].every(function(c){ return /^:?-+:?$/.test(c.replace(/\s/g, '')); });
        var h = '<div class="tw"><table>';
        rows.forEach(function(r, ri){
          if (head && ri === 1) return;
          var tag = head && ri === 0 ? 'th' : 'td';
          h += '<tr>' + r.map(function(c){ return '<' + tag + '>' + mdInline(c) + '</' + tag + '>'; }).join('') + '</tr>';
        });
        out.push(h + '</table></div>'); continue;
      }
      if ((m = /^[-*+]\s+(.*)$/.exec(t))) { open('ul'); out.push('<li>' + mdInline(m[1]) + '</li>'); i++; continue; }
      if ((m = /^\d+[.)]\s+(.*)$/.exec(t))) { open('ol'); out.push('<li>' + mdInline(m[1]) + '</li>'); i++; continue; }
      close(); out.push('<p>' + mdInline(t) + '</p>'); i++;
    }
    close();
    return out.join('');
  }

      host = $('#pages');
      if (!window.pdfjsLib) { host.innerHTML = '<p class="rmsg">' + esc(t('err_nolib')) + '</p>'; return; }
      function setZoom(d){ zi = Math.max(0, Math.min(ZOOMS.length - 1, zi + d)); $('#zl').textContent = Math.round(ZOOMS[zi] * 100) + '%'; $('#zout').disabled = zi === 0; $('#zin').disabled = zi === ZOOMS.length - 1; draw(); }
      $('#zout').onclick = function(){ setZoom(-1); };
      $('#zin').onclick = function(){ setZoom(1); };
      $('#zout').disabled = true;
      function draw(){
        if (!pdfDoc) return;
        var my = ++token, w = Math.floor(host.clientWidth * ZOOMS[zi]), chain = Promise.resolve();
        host.innerHTML = '';
        for (var n = 1; n <= pdfDoc.numPages; n++) (function(n){
          chain = chain.then(function(){
            if (my !== token) return;
            return pdfDoc.getPage(n).then(function(page){
              if (my !== token) return;
              var vp = page.getViewport({scale: 1}), k = w / vp.width, cssH = vp.height * k;
              var dpr = Math.min(window.devicePixelRatio || 1, 3), area = (w * dpr) * (cssH * dpr);
              if (area > 9e6) dpr *= Math.sqrt(9e6 / area);
              var c = document.createElement('canvas');
              c.className = 'pg'; c.width = Math.floor(w * dpr); c.height = Math.floor(cssH * dpr);
              c.style.width = w + 'px'; c.style.height = cssH + 'px';
              c.setAttribute('role', 'img'); c.setAttribute('aria-label', t('page_of', {n: n, m: pdfDoc.numPages}));
              host.appendChild(c);
              return page.render({canvasContext: c.getContext('2d'), viewport: page.getViewport({scale: k * dpr})}).promise;
            });
          });
        })(n);
        chain.catch(function(){ if (my === token && !host.childNodes.length) host.innerHTML = '<p class="rmsg">' + esc(t('err_draw')) + '</p>'; });
      }
      pdfjsLib.getDocument({data: new Uint8Array(rec.data.slice(0))}).promise.then(function(doc){
        pdfDoc = doc; draw();
        var lastW = host.clientWidth;
        onResize = function(){ if (!host.isConnected) { onResize = null; return; } if (Math.abs(host.clientWidth - lastW) > 20) { lastW = host.clientWidth; draw(); } };
      }).catch(function(){ host.innerHTML = '<p class="rmsg">' + esc(t('err_open')) + '</p>'; });
    });
  }

      '<header><p class="eyebrow"><span>' + plural(deck.items.length, 'chunk') + '</span></p>' +
      '<h1><span class="hl">' + esc(deck.title) + '</span></h1></header>' +
      (have[deck.id] ? '<div class="row" style="margin-top:18px"><button class="btn ghost" data-read="' + esc(deck.id) + '" style="flex:none">' + esc(t('read_first')) + '</button></div>' : '') +
      (SPEECH && deck.id !== '*' && deck.id !== '!' && deck.id.slice(0, 2) !== 'm:' ? '<div class="voice"><span class="label" style="margin:0">' + esc(t('speak_in')) + '</span><div class="seg" role="group" aria-label="' + esc(t('voice_lang')) + '">' +
        [['en', 'English'], ['es', 'Español'], ['ru', 'Русский'], ['de', 'Deutsch'], ['sr', 'Srpski'], ['fr', 'Français'], ['off', t('off')]].map(function(o){ return '<button class="segb' + (deck.lang === o[0] ? ' on' : '') + '" data-lang="' + o[0] + '" aria-pressed="' + (deck.lang === o[0]) + '">' + o[1] + '</button>'; }).join('') + '</div></div>' + (deck.lang !== 'off' ? '<div id="vbox">' + voiceSelect(deck.lang) + '</div>' : '') : '') +
      '<div class="tiles">' + MODES.map(function(m){
        var ls = m.id === 'listen', n = ls ? listenItems(deck).length : deck.items.length, off = n < m.min;
        return '<button class="tile' + (ls ? ' wide' : '') + '" data-mode="' + m.id + '"' + (off ? ' disabled' : '') + '><span class="tn">' + esc(t(m.name)) + '</span><span class="tc">' + esc(off ? t(ls ? 'needs_voice' : 'needs_more') : m.count(deck)) + '</span>' +
          '<span class="tl">' + esc(last[m.id] ? t('last', {x: last[m.id]}) : t('not_tried')) + '</span></button>';
      }).join('') + '</div>';
    window.scrollTo(0, 0);
    bindVoiceSelect(deck);
  }
  function bindVoiceSelect(deck){
    var sel = document.getElementById('vsel'); if (!sel || !deck.lang) return;
    sel.onchange = function(){
      if (sel.value) CHOSEN[deck.lang] = sel.value; else delete CHOSEN[deck.lang];
      try { localStorage.setItem('revision-room:voices', JSON.stringify(CHOSEN)); } catch (e) {}
      var l = S.lessons.filter(function(x){ return x.id === deck.id; })[0];
      if (l && l.items.length) speak(l.items[0].a, deck.lang);
    };
  }
  if (SPEECH) { try { speechSynthesis.addEventListener('voiceschanged', function(){ var b = document.getElementById('vbox'); if (b && cur && cur.lang && cur.lang !== 'off') { b.innerHTML = voiceSelect(cur.lang); bindVoiceSelect(cur); } if (cur && app.querySelector('.tiles')) { var fd = deckOf(cur.id); if (fd) menu(fd); } }); } catch (e) {} }
  function run(id){ if (id === 'cards') flash(cur); else if (id === 'gaps') gaps(cur); else if (id === 'quiz') quiz(cur); else if (id === 'match') match(cur); else if (id === 'listen') listen(cur); }

  function finish(id, o){
    stopSpeech();
    if (o.save !== false) { S.last[cur.id] = S.last[cur.id] || {}; S.last[cur.id][id] = o.last; persist(); }
    var msg = o.pct >= 90 ? t('r_clean') : o.pct >= 60 ? t('r_solid') : t('r_more');
    app.innerHTML = '<div class="res"><p class="label">' + esc(t('finished')) + '</p><p class="big">' + esc(o.big) + '</p><p class="sub">' + esc(o.sub) + '</p><p class="msg2">' + msg + '</p>' +
      '<div class="row">' + (o.retry ? '<button class="btn primary" id="retry">' + esc(t('retry')) + '</button>' : '') +
      '<button class="btn ' + (o.retry ? 'ghost' : 'primary') + '" id="again">' + esc(t('again_go')) + '</button><button class="btn ghost" data-back>' + esc(t('back_lesson')) + '</button></div></div>';
    if (o.retry) $('#retry').onclick = o.retry;
    $('#again').onclick = o.again;
    window.scrollTo(0, 0);
  }

  /* ---------- Flashcards ---------- */
  function flash(deck){
    var cards = deck.items.map(function(it){ return {front: it.a, back: it.b, l: it.l, src: it}; });
    var total = cards.length, q = shuffle(cards.map(function(_, i){ return i; }));
    var known = 0, rev = false, flipped = false, again = {}, againN = 0;
    function draw(){
      if (!q.length) {
        var first = total - againN;
        return finish('cards', {big: first + ' / ' + total, sub: t('cards_known'), pct: first / total * 100, last: first + '/' + total, again: function(){ flash(deck); }});
      }
      var c = cards[q[0]];
      var front = rev ? c.back : c.front, back = rev ? c.front : c.back;
      var lblQ = t('question'), lblA = t('answer');
      var talk = SPEECH && LOCALES[c.l] && !(rev && !flipped), noVoice = talk && !hasVoiceFor(c.l);
      app.innerHTML = top(known, total, t('known', {k: known, n: total})) +
        '<div class="fwrap"><button class="flash" id="flip" aria-label="' + esc(t('flip_aria', {s: flipped ? lblA : lblQ})) + '"><span class="side">' + (flipped ? lblA : lblQ) + '</span>' +
        '<span class="face ' + (flipped ? 'back' : '') + '">' + esc(flipped ? back : front) + '</span></button>' +
        (talk && !noVoice ? '<button class="spk" id="spk" aria-label="' + esc(t('hear')) + '"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>' : '') + '</div>' +
        (noVoice ? '<p class="hint">' + esc(t('no_voice_card', {l: LN(c.l)})) + '</p>' : '') +
        (flipped ? '<div class="row"><button class="btn ghost" id="again">' + esc(t('again')) + '</button><button class="btn primary" id="got">' + esc(t('got')) + '</button></div>' : '<p class="hint">' + esc(t('tap_flip')) + '</p>') +
        '<div class="links"><button class="link small" id="swap">' + esc(rev ? t('show_q') : t('show_a')) + '</button>' +
        (talk && !noVoice ? '<button class="link small" id="slow" aria-pressed="' + SLOW + '">' + esc(SLOW ? t('slow_on') : t('slow_off')) + '</button>' : '') + '</div>';
      $('#flip').onclick = function(){ flipped = !flipped; draw(); if (flipped && $('#got')) $('#got').focus(); };
      $('#swap').onclick = function(){ rev = !rev; flipped = false; draw(); };
      if ($('#spk')) $('#spk').onclick = function(){ speak(c.front, c.l); };
      if ($('#slow')) $('#slow').onclick = function(){ SLOW = !SLOW; try { localStorage.setItem('revision-room:slow', SLOW ? '1' : '0'); } catch (e) {} draw(); speak(c.front, c.l); };
      if (flipped) {
        $('#got').onclick = function(){ track(c.src, true); q.shift(); known++; flipped = false; draw(); };
        $('#again').onclick = function(){ track(c.src, false); if (!again[q[0]]) { again[q[0]] = 1; againN++; } q.push(q.shift()); flipped = false; draw(); };
      }
    }
    draw();
    window.scrollTo(0, 0);
  }

  /* ---------- Fill the gaps ---------- */
  function gaps(deck, list){
    var items = list || sample(deck.items, 10).map(Parser.makeGap), n = items.length, i = 0, right = 0, wrong = [];
    function draw(){
      if (i >= n) {
        return finish('gaps', {big: right + ' / ' + n, sub: t('sentences_ok'), pct: right / n * 100, last: right + '/' + n, save: !list,
          again: function(){ gaps(deck); }, retry: wrong.length ? function(){ gaps(deck, wrong); } : null});
      }
      var it = items[i], blanks = [], k = 0;
      var html = it.text.split(/\{\{(.+?)\}\}/g).map(function(p, idx){
        if (idx % 2 === 0) return esc(p);
        blanks.push(p); k++;
        return '<input class="gap" type="text" style="width:' + Math.max(4, p.split('|')[0].length + 2) + 'ch" aria-label="' + esc(t('blank', {k: k})) + '" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">';
      }).join('');
      app.innerHTML = top(i, n, (i + 1) + ' / ' + n) +
        '<p class="label">' + esc(it.whole ? t('type_phrase') : t('fill_gap')) + '</p><p class="sentence">' + html + '</p>' +
        (it.hint ? '<p class="hint">' + esc(it.hint) + '</p>' : '') +
        '<div id="fb" role="status"></div><div class="row" id="act"><button class="btn primary" id="check">' + esc(t('check')) + '</button></div>';
      var ins = [].slice.call(app.querySelectorAll('input.gap')), checked = false;
      if (ins[0]) ins[0].focus();
      function doCheck(){
        if (checked) return; checked = true;
        var ok = true;
        ins.forEach(function(inp, j){
          var accepted = blanks[j].split('|').map(norm), good = accepted.indexOf(norm(inp.value)) > -1;
          inp.readOnly = true; inp.classList.add(good ? 'ok' : 'no');
          if (!good) { ok = false; inp.insertAdjacentHTML('afterend', '<span class="fix">' + esc(blanks[j].split('|')[0]) + '</span>'); }
        });
        track(it.src, ok);
        if (ok) right++; else wrong.push(it);
        $('#fb').innerHTML = '<div class="fb ' + (ok ? 'ok' : 'no') + '"><b>' + esc(ok ? t('correct') : t('not_quite')) + '</b> ' + esc(ok ? '' : t('answer_green')) + '</div>';
        $('#act').innerHTML = '<button class="btn primary" id="next">' + esc(i === n - 1 ? t('see_results') : t('next')) + '</button>';
        $('#next').onclick = function(){ i++; draw(); };
        $('#next').focus();
      }
      ins.forEach(function(inp){ inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); doCheck(); } }); });
      $('#check').onclick = doCheck;
    }
    draw();
    window.scrollTo(0, 0);
  }

  /* ---------- Quiz ---------- */
  function quiz(deck, list){
    var items = list || Parser.makeQuiz(deck.items, 10), n = items.length, i = 0, right = 0, wrong = [];
    function draw(){
      if (i >= n) {
        return finish('quiz', {big: right + ' / ' + n, sub: t('questions_ok'), pct: right / n * 100, last: right + '/' + n, save: !list,
          again: function(){ quiz(deck); }, retry: wrong.length ? function(){ quiz(deck, wrong); } : null});
      }
      var it = items[i];
      var opts = shuffle(it.options.map(function(t, idx){ return {t: t, c: idx === it.answer}; }));
      app.innerHTML = top(i, n, (i + 1) + ' / ' + n) +
        '<p class="q">' + esc(it.q) + '</p><div class="opts">' +
        opts.map(function(o, j){ return '<button class="opt" data-j="' + j + '"><span class="k">' + 'ABCDEF'[j] + '</span><span>' + esc(o.t) + '</span></button>'; }).join('') +
        '</div><div id="fb" role="status"></div><div class="row" id="act"></div>';
      [].forEach.call(app.querySelectorAll('.opt'), function(btn){
        btn.onclick = function(){
          var ok = opts[+btn.dataset.j].c;
          [].forEach.call(app.querySelectorAll('.opt'), function(b){
            var o = opts[+b.dataset.j]; b.disabled = true;
            if (o.c) b.classList.add('right'); else if (b === btn) b.classList.add('wrong'); else b.classList.add('dim');
          });
          track(it.src, ok);
          if (ok) right++; else wrong.push(it);
          $('#fb').innerHTML = '<div class="fb ' + (ok ? 'ok' : 'no') + '"><b>' + esc(ok ? t('correct') : t('not_quite')) + '</b> ' + (it.explain ? esc(it.explain) : '') + '</div>';
          $('#act').innerHTML = '<button class="btn primary" id="next">' + esc(i === n - 1 ? t('see_results') : t('next')) + '</button>';
          $('#next').onclick = function(){ i++; draw(); };
          $('#next').focus();
        };
      });
    }
    draw();
    window.scrollTo(0, 0);
  }

  /* ---------- Listening: hear the phrase, type it ---------- */
  function fold(s){ return norm(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\u0451/g, '\u0435'); }
  function listen(deck, list){
    var items = list || sample(listenItems(deck), 10), n = items.length, i = 0, right = 0, wrong = [];
    var ICON = '<svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
    function draw(){
      if (!n || i >= n) {
        return finish('listen', {big: right + ' / ' + n, sub: t('heard_ok'), pct: n ? right / n * 100 : 0, last: right + '/' + n, save: !list,
          again: function(){ listen(deck); }, retry: wrong.length ? function(){ listen(deck, wrong); } : null});
      }
      var it = items[i];
      app.innerHTML = top(i, n, (i + 1) + ' / ' + n) +
        '<p class="label">' + esc(t('listen_label')) + '</p>' +
        '<div class="lwrap"><button class="lspk" id="spk" aria-label="' + esc(t('hear')) + '">' + ICON + '</button></div>' +
        '<input class="lin" id="lin" type="text" aria-label="' + esc(t('listen_label')) + '" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">' +
        '<p class="hint" id="lhint"></p><div id="fb" role="status"></div><div class="row" id="act"><button class="btn primary" id="check">' + esc(t('check')) + '</button></div>' +
        '<div class="links"><button class="link small" id="meaning">' + esc(t('show_meaning')) + '</button>' +
        '<button class="link small" id="slow" aria-pressed="' + SLOW + '">' + esc(SLOW ? t('slow_on') : t('slow_off')) + '</button></div>';
      var inp = $('#lin'), checked = false;
      inp.focus();
      $('#spk').onclick = function(){ speak(it.a, it.l); inp.focus(); };
      $('#slow').onclick = function(){ SLOW = !SLOW; try { localStorage.setItem('revision-room:slow', SLOW ? '1' : '0'); } catch (e) {} $('#slow').textContent = SLOW ? t('slow_on') : t('slow_off'); $('#slow').setAttribute('aria-pressed', SLOW); speak(it.a, it.l); inp.focus(); };
      $('#meaning').onclick = function(){ $('#lhint').textContent = it.b; };
      function doCheck(){
        if (checked) return; checked = true;
        var typed = inp.value, spoken = speakable(it.a), plain = it.a.replace(/\([^)]*\)/g, ' ');
        var exact = [it.a, spoken, plain].some(function(x){ return norm(x) === norm(typed); });
        var near = !exact && [it.a, spoken, plain].some(function(x){ return fold(x) === fold(typed); });
        var ok = exact || near;
        track(it, ok);
        if (ok) right++; else wrong.push(it);
        inp.readOnly = true; inp.classList.add(ok ? 'ok' : 'no');
        $('#fb').innerHTML = '<div class="fb ' + (ok ? 'ok' : 'no') + '"><b>' + esc(ok ? t('correct') : t('not_quite')) + '</b> ' +
          esc(near ? t('l_accents', {x: it.a}) : ok ? '' : t('l_answer', {x: it.a})) + (ok ? '' : '<br>' + esc(it.b)) + '</div>';
        $('#act').innerHTML = '<button class="btn primary" id="next">' + esc(i === n - 1 ? t('see_results') : t('next')) + '</button>';
        $('#next').onclick = function(){ i++; draw(); };
        $('#next').focus();
      }
      inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); if (checked) { i++; draw(); } else doCheck(); } });
      $('#check').onclick = doCheck;
      speak(it.a, it.l);
    }
    draw();
    window.scrollTo(0, 0);
  }

  /* ---------- Matching ---------- */
  function match(deck){
    var pairs = sample(deck.items, 12).map(function(p, i){ return {id: i, a: p.a, b: p.b, s: p}; });
    var size = pairs.length <= 7 ? pairs.length : 6, rounds = [];
    for (var s = 0; s < pairs.length; s += size) rounds.push(pairs.slice(s, s + size));
    if (rounds.length > 1 && rounds[rounds.length - 1].length < 3) { var tail = rounds.pop(); rounds[rounds.length - 1] = rounds[rounds.length - 1].concat(tail); }
    var r = 0, slips = 0, total = pairs.length, doneTotal = 0;
    function draw(){
      if (r >= rounds.length) {
        var pct = total / (total + slips) * 100, s2 = slips === 0 ? t('no_slips') : plural(slips, 'slip');
        return finish('match', {big: s2, sub: t('pairs_matched', {n: total}), pct: pct, last: s2, again: function(){ match(deck); }});
      }
      var round = rounds[r], left = shuffle(round), right = shuffle(round), sel = null, matched = 0;
      function label(){ return t('round_of', {r: r + 1, m: rounds.length, s: plural(slips, 'slip')}); }
      app.innerHTML = top(doneTotal, total, label()) +
        '<p class="label">' + esc(t('match_help')) + '</p><div class="cols">' +
        '<div class="col">' + left.map(function(p){ return '<button class="chip" data-side="a" data-id="' + p.id + '">' + esc(p.a) + '</button>'; }).join('') + '</div>' +
        '<div class="col">' + right.map(function(p){ return '<button class="chip" data-side="b" data-id="' + p.id + '">' + esc(p.b) + '</button>'; }).join('') + '</div></div>';
      [].forEach.call(app.querySelectorAll('.chip'), function(chip){
        chip.onclick = function(){
          if (chip.classList.contains('done')) return;
          var side = chip.dataset.side, id = chip.dataset.id;
          if (sel && sel.el === chip) { chip.classList.remove('sel'); sel = null; return; }
          if (sel && sel.side !== side) {
            if (sel.id === id) {
              track(pairs[+id].s, true);
              sel.el.classList.remove('sel'); sel.el.classList.add('done'); chip.classList.add('done');
              sel = null; matched++; doneTotal++;
              $('.prog i').style.width = (doneTotal / total * 100) + '%';
              if (matched === round.length) setTimeout(function(){ r++; draw(); }, 500);
            } else {
              slips++; track(pairs[+(side === 'a' ? id : sel.id)].s, false);
              var other = sel.el; other.classList.remove('sel'); sel = null;
              other.classList.add('slip'); chip.classList.add('slip');
              setTimeout(function(){ other.classList.remove('slip'); chip.classList.remove('slip'); }, 420);
              $('.count').textContent = label();
            }
            return;
          }
          if (sel) sel.el.classList.remove('sel');
          chip.classList.add('sel'); sel = {el: chip, side: side, id: id};
        };
      });
    }
    draw();
    window.scrollTo(0, 0);
  }

  loadKeys().then(function(){ library(); checkShared(); }, function(){ library(); checkShared(); });
  if (IS_PWA && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
  if (IS_PWA && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
})();
</script>
